  parameters: {}
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                required:
                  - status
        "503":
          description: Request failed. Use the stable error code for client behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/methods:
    get:
      tags: &a1
        - Authentication
      security: &a2 []
      operationId: getAuthMethods
      responses:
        "200":
          description: Configured sign-in options; no credentials are exposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  google:
                    type: boolean
                  apple:
                    type: boolean
                  emailOtp:
                    type: boolean
                  otp:
                    type: object
                    properties:
                      length:
                        type: number
                        enum:
                          - 6
                      expiresInSeconds:
                        type: number
                        enum:
                          - 600
                      resendAfterSeconds:
                        type: number
                        enum:
                          - 60
                      maxSendsPerHour:
                        type: number
                        enum:
                          - 3
                    required:
                      - length
                      - expiresInSeconds
                      - resendAfterSeconds
                      - maxSendsPerHour
                required:
                  - google
                  - apple
                  - emailOtp
                  - otp
  /api/auth/email-otp/send-verification-otp:
    post:
      tags: *a1
      security: *a2
      operationId: sendSignInCode
      description: Works for both first-time registration and returning sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                type:
                  type: string
                  enum:
                    - sign-in
              required:
                - email
                - type
              additionalProperties: false
      responses:
        "200":
          description: "Success. Store a returned session token in Keychain and use Authorization: Bearer
            <token>."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "400":
          description: Invalid input, incorrect/expired/consumed code, or unavailable provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "401":
          description: Invalid identity token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "403":
          description: Unverified identity, disallowed origin, or too many code attempts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "429":
          description: Rate limited; honor Retry-After in seconds.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "503":
          description: Email delivery unavailable. A new request is needed after the cooldown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
  /api/auth/sign-in/email-otp:
    post:
      tags: *a1
      security: *a2
      operationId: verifySignInCode
      description: Works for both first-time registration and returning sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                otp:
                  type: string
                  pattern: ^\d{6}$
                name:
                  type: string
                  maxLength: 100
              required:
                - email
                - otp
              additionalProperties: false
      responses:
        "200":
          description: "Success. Store a returned session token in Keychain and use Authorization: Bearer
            <token>."
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      emailVerified:
                        type: boolean
                      name:
                        type: string
                      image:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - email
                      - emailVerified
                      - name
                      - createdAt
                      - updatedAt
                required:
                  - token
                  - user
        "400":
          description: Invalid input, incorrect/expired/consumed code, or unavailable provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
        "401":
          description: Invalid identity token.
          content:
