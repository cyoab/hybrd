                              maxLength: 100
                            lastName:
                              type: string
                              maxLength: 100
                      additionalProperties: false
                  required:
                    - token
                    - nonce
                  additionalProperties: false
              required:
                - provider
                - idToken
              additionalProperties: false
      responses:
        "200":
          description: "Success. Store a returned session token in Keychain and use Authorization: Bearer
            <token>."
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
